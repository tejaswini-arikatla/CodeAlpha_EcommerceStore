<!DOCTYPE html>
<html>

<head>
  <title>Register</title>

  <link rel="stylesheet"
        href="./css/style.css">
</head>

<body>

<div class="navbar">
  <h2>E-Shop</h2>
</div>

<div class="form-container">

  <h2>Register</h2>

  <input
    type="text"
    id="name"
    placeholder="Enter Name"
  >

  <input
    type="email"
    id="email"
    placeholder="Enter Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Enter Password"
  >

  <button onclick="register()">
    Register
  </button>

</div>

<script src="./js/register.js"></script>

</body>
</html>
